<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global FX Telemetry & AI Forecasting Engine</title>
    <!-- Chart.js for time-series visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 25px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--accent-blue);
            letter-spacing: 1px;
        }

        .status-badge {
            font-size: 0.85rem;
            background: var(--card-bg);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            color: var(--accent-green);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .card-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: monospace;
        }

        .card-sub {
            font-size: 0.75rem;
            color: var(--accent-purple);
            margin-top: 5px;
        }

        .chart-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            height: 450px;
        }
    </style>
</head>
<body>

    <header>
        <h1>FX TELEMETRY // TIME-SERIES & AI PREDICTION ENGINE</h1>
        <div class="status-badge" id="apiStatus">Initializing Pipeline...</div>
    </header>

    <div class="grid-container" id="metricsGrid">
        <!-- Rendered via script -->
    </div>

    <div class="chart-section">
        <canvas
