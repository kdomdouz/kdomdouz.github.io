<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Central Bank Financial Telemetry</title>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 25px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-blue);
            letter-spacing: 1px;
        }

        .status-badge {
            font-size: 0.85rem;
            background: var(--card-bg);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            color: var(--accent-green);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .card-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 1.6rem;
            font-weight: bold;
            font-family: monospace;
        }

        .chart-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            height: 420px;
        }
    </style>
</head>
<body>

    <header>
        <h1>GLOBAL FX TELEMETRY // CENTRAL BANK FEEDS</h1>
        <div class="status-badge" id="apiStatus">Connecting to Central Bank Data...</div>
    </header>

    <div class="grid-container" id="metricsGrid">
        <!-- Live financial cards injected via script -->
    </div>

    <div class="chart-section">
        <canvas id="financialChart"></canvas>
    </div>

    <script>
        let financialChart = null;

        async function fetchFinancialData() {
            try {
                // Fetch real official reference rates from the European Central Bank / global banks API (Base USD)
                const response = await fetch('https://api.frankfurter.dev/v1/latest?base=USD');
                const data = await response.json();

                document.getElementById('apiStatus').innerText = `Source: Official ECB Feed (${data.date})`;

                const rates = data.rates;
                
                // Select key major global fiat currencies
                const eur = rates.EUR;
                const gbp = rates.GBP;
                const jpy = rates.JPY;
                const chf = rates.CHF;

                // Render financial cards with real market data
                const grid = document.getElementById('metricsGrid');
                grid.innerHTML = `
                    <div class="card">
                        <div class="card-title">USD / EUR (Euro)</div>
                        <div class="card-value">€${eur}</div>
                    </div>
                    <div class="card">
                        <div class="card-title">USD / GBP (British Pound)</div>
                        <div class="card-value">£${gbp}</div>
                    </div>
                    <div class="card">
                        <div class="card-title">USD / JPY (Japanese Yen)</div>
                        <div class="card-value">¥${jpy}</div>
                    </div>
                    <div class="card">
                        <div class="card-title">USD / CHF (Swiss Franc)</div>
                        <div class="card-value">₣${chf}</div>
                    </div>
                `;

                // Build or update the analytical bar chart with real exchange data
                const ctx = document.getElementById('financialChart').getContext('2d');
                
                if (!financialChart) {
                    financialChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['EUR (Euro)', 'GBP (British Pound)', 'JPY (Japanese Yen)', 'CHF (Swiss Franc)'],
                            datasets: [{
                                label: 'Exchange Value relative to 1.0 USD',
                                data: [eur, gbp, jpy, chf],
                                backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
