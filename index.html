<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clocks - My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 5vh 20px;
        }
        h1 {
            color: #0366d6;
            margin-bottom: 30px;
        }
        .clock-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .clock-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 200px;
        }
        .city-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #24292e;
        }
        .time {
            font-size: 1.3rem;
            color: #0366d6;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>World Clocks</h1>
    <p>Live times from different cities around the world:</p>
    
    <div class="clock-container" id="clockContainer">
        <!-- Clocks will be injected here by JavaScript -->
    </div>

    <script>
        // Define cities and their respective IANA timezones
        const cities = [
            { name: "New York", zone: "America/New_York" },
            { name: "London", zone: "Europe/London" },
            { name: "Paris", zone: "Europe/Paris" },
            { name: "Tokyo", zone: "Asia/Tokyo" },
            { name: "Sydney", zone: "Australia/Sydney" }
        ];

        function updateClocks() {
            const container = document.getElementById("clockContainer");
            container.innerHTML = ""; // Clear previous HTML

            cities.forEach(city => {
                const now = new Date();
                const timeString = now.toLocaleTimeString("en-US", {
                    timeZone: city.zone,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });

                // Create a card element for each city
                const card = document.createElement("div");
                card.className = "clock-card";
                card.innerHTML = `
                    <div class="city-name">${city.name}</div>
                    <div class="time">${timeString}</div>
                `;
                container.appendChild(card);
            });
        }

        // Update immediately, then every second
        updateClocks();
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
